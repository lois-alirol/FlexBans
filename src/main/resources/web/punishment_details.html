<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{punishment_page_title}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com/"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <meta property="og:title" content="{{punishment_page_title}}">
    <meta property="og:description" content="{{punishment_description}}">
    <meta property="og:image" content="{{server_icon}}">
    <meta name="theme-color" content="{{server_color}}">
    <link rel="icon" type="image/x-icon" sizes="48x48" href="{{favicon}}">
    <script>
        tailwind.config = {
          darkMode: 'class',
        }
    </script>
    <style>
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.dark {
            background-color: #121212;
            color: #ffffff;
        }

        body.bg-light-bg {
            background-color: #f4f4f4;
            color: #333333;
        }
    </style>
    <script>
        (function() {
            const theme = localStorage.getItem('darkMode');
            const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (theme === 'enabled') {
                document.documentElement.classList.add('dark');
            } else if (theme === 'disabled') {
                document.documentElement.classList.remove('dark');
            } else if (prefersDarkScheme) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <style>
        table {
            border-collapse: separate;
            border-spacing: 0;
        }

        th,
        td {
            border: 1px solid rgba(75, 75, 75, 0.5);
            padding: 16px;
        }

        thead th {
            border-bottom: 2px solid rgba(100, 100, 100, 0.6);
        }
    </style>
</head>

<body class="bg-white text-[#333333] dark:text-[#e0e0e0] dark:bg-[#1c1c1c] font-sans">

    <div class="container mx-auto p-8 max-w-4xl">
        <!-- Back Button -->
        <a href="/index" class="absolute top-0 left-0 mt-2 ml-2 bg-[{{server_color}}] text-white py-2 px-4 rounded-lg hover:bg-[{{server_color_hover}}]">
            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Index
        </a>

        <h1 class="text-center text-3xl font-bold mb-8">{{punishment_title}}</h1>

        <!-- Punishment Table -->
        <div class="overflow-hidden rounded-lg shadow-lg">
            <table class="table-auto w-full bg-[#ffffffe6] dark:bg-[#2c2c2ce6] text-[#333333] dark:text-[#e0e0e0]">
                <tbody>
                    <tr>
                        <th class="w-1/3 bg-[#ccc] dark:bg-[#444]">Player</th>
                        <td>{{player_name}}</td>
                    </tr>
                    <tr>
                        <th class="w-1/3 bg-[#ccc] dark:bg-[#444]">Executor</th>
                        <td>{{executor}}</td>
                    </tr>
                    <tr>
                        <th class="w-1/3 bg-[#ccc] dark:bg-[#444]">Reason</th>
                        <td>{{reason}}</td>
                    </tr>
                    <tr>
                        <th class="w-1/3 bg-[#ccc] dark:bg-[#444]">Execution Date</th>
                        <td>{{execution_date}}</td>
                    </tr>
                    <tr>
                        <th class="w-1/3 bg-[#ccc] dark:bg-[#444]">Expiration Date</th>
                        <td>{{expiration_date}}</td>
                    </tr>
                    <tr>
                        <th class="w-1/3 bg-[#ccc] dark:bg-[#444]">Duration</th>
                        <td>{{duration}}</td>
                    </tr>
                    <tr>
                        <th class="w-1/3 bg-[#ccc] dark:bg-[#444]">Origin Server</th>
                        <td>{{origin_server}}</td>
                    </tr>
                    {{removal_reason}}
                </tbody>
            </table>
        </div>

        {{revoke_button}}
    </div>
    <div id="revoke-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white dark:bg-[#1c1c1c] text-[#333333] dark:text-[#e0e0e0] p-8 rounded-lg shadow-lg max-w-md w-full">
            <h2 class="text-xl font-semibold mb-4">Revoke Punishment</h2>
            <form id="revoke-form">
                <div class="mb-4">
                    <label for="identity" class="block font-medium mb-1">Who are you?</label>
                    <input type="text" id="identity" name="identity" class="w-full p-2 border rounded-md text-[#333333] bg-gray-300 cursor-not-allowed" value="{{remover_name}}" readonly required>
                </div>
                <div class="mb-4">
                    <label for="removal-reason" class="block font-medium mb-1">Reason for Removal</label>
                    <textarea id="removal-reason" name="removal-reason" class="w-full p-2 border rounded-md text-[#333333]" rows="4" required></textarea>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancel-button" class="bg-gray-500 hover:bg-gray-600 text-white py-2 px-4 rounded-lg">Cancel</button>
                    <button type="submit" class="bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-lg">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script>

        $(document).ready(function () {
            $('#revoke-button').on('click', function () {
                $('#revoke-modal').removeClass('hidden');
            });

            $('#cancel-button').on('click', function () {
                $('#revoke-modal').addClass('hidden');
            });

            $('#revoke-form').on('submit', function (e) {
                e.preventDefault();

                const data = {
                    punishmentType: '{{punishment_type}}',
                    punishmentId: '{{punishment_id}}',
                    identity: '{{remover_name}}',
                    removalReason: $('#removal-reason').val()
                };

                $.ajax({
                    url: '/revoke-punishment',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function (response) {
                        alert(response.message || 'Punishment revoked successfully!');
                        $('#revoke-modal').addClass('hidden');
                        location.reload();
                    },
                    error: function (xhr, status, error) {
                        console.error('Error details:', xhr.status, xhr.responseText);
                        alert('Error revoking punishment: ' + (xhr.responseText || 'Unknown error'));
                    }
                });
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            const darkModeToggle = document.getElementById('dark-mode-toggle');
            const darkModeIcon = document.getElementById('dark-mode-icon');

            const toggleDarkMode = () => {
                document.documentElement.classList.toggle('dark');

                darkModeIcon.classList.toggle('fa-moon');
                darkModeIcon.classList.toggle('fa-sun');

                if (document.documentElement.classList.contains('dark')) {
                    localStorage.setItem('darkMode', 'enabled');
                } else {
                    localStorage.setItem('darkMode', 'disabled');
                }
            };
        });
    </script>

</body>

</html>
