<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="403 - {{server_name}}">
    <meta property="og:description" content="Access forbidden on {{server_name}}">
    <meta property="og:image" content="{{server_icon}}">
    <meta name="theme-color" content="{{server_color}}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" sizes="48x48" href="{{server_favicon}}">
    <title>403 - {{server_name}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #123456;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-[#2e2e2e] text-[#e4e4e7] flex items-center justify-center min-h-screen">
    <div class="bg-[#1f1f1f] p-8 rounded-lg shadow-lg w-full max-w-lg text-center">
        <img src="{{server_logo}}" alt="Server Logo" class="w-32 mx-auto mb-6">
        <h1 class="text-5xl mb-4 font-bold">403 Forbidden</h1>
        <p class="mb-6 text-lg">You don’t have permission to access this page.</p>
        <a href="/" class="bg-[{{server_color}}] hover:bg-[{{server_color_hover}}] text-white font-bold py-3 px-6 rounded-lg inline-block transition duration-300">
            <i class="fa-solid fa-home mr-2"></i>Return to Homepage
        </a>
    </div>
</body>

</html>
