name: FlexBans
main: fr.neocle.flexbans.bungee.FlexBansBungee
version: 1.0-SNAPSHOT
author: Neocle
softDepends:
  - Litebans
commands:
  flexbans:
    description: Reloads the FlexBans configuration.
    aliases: [ fb ]
    permission: flexbans.reload
permissions:
  flexbans.reload:
    description: Allows reloading the FlexBans configuration.
    default: admin
