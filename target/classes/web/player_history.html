<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{player_name}} Punishments</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com/"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <meta property="og:title" content="{{player_name}} Punishments">
    <meta property="og:description" content="{{player_description}}">
    <meta property="og:image" content="{{player_icon}}">
    <meta name="theme-color" content="{{server_color}}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{favicon}}">
    <script>
        tailwind.config = {
          darkMode: 'class',
        }
    </script>
    <style>
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.dark {
            background-color: #121212;
            color: #ffffff;
        }

        body.bg-light-bg {
            background-color: #f4f4f4;
            color: #333333;
        }
    </style>
    <script>
        (function() {
            const theme = localStorage.getItem('darkMode');
            const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (theme === 'enabled') {
                document.documentElement.classList.add('dark');
            } else if (theme === 'disabled') {
                document.documentElement.classList.remove('dark');
            } else if (prefersDarkScheme) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(100, 100, 100, 0.7);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(150, 150, 150, 0.8);
        }

        ::-webkit-scrollbar-track {
            background-color: rgba(44, 44, 44, 0.3);
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(100, 100, 100, 0.7) rgba(44, 44, 44, 0.3);
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
        }

        th,
        td {
            border: 1px solid rgba(75, 75, 75, 0.5);
            padding: 16px;
        }

        thead th {
            border-bottom: 2px solid rgba(100, 100, 100, 0.6);
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
    </style>
</head>

<body class="bg-white text-[#333333] dark:text-[#e0e0e0] dark:bg-[#1c1c1c]">

    <div class="max-w-7xl mx-auto p-5">

        <a href="/index" class="absolute top-0 left-0 mt-2 ml-2 bg-[{{server_color}}] text-white py-2 px-4 rounded-lg hover:bg-[{{server_color_hover}}]">
            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Index
        </a>    

        <h1 class="text-center text-black dark:text-white text-3xl font-bold">{{player_name}} Recent Punishments</h1>
    
        <!-- Search and Filter -->
        <div class="flex flex-col sm:flex-row justify-center my-8 gap-4">
            <input type="text" id="searchInput" placeholder="Search Player..." class="w-full sm:w-2/3 bg-[#f0f0f0cc] dark:bg-[#3b3b3bcc] text-[#333333] dark:text-[#e0e0e0] rounded-lg p-3 outline-none focus:ring focus:ring-[{{server_color_hover}}]">
            <button id="filterButton" class="w-full sm:w-32 bg-[#f0f0f0cc] dark:bg-[#3b3b3bcc] text-[#333333] dark:text-[#e0e0e0] rounded-lg py-2">Filter</button>
        </div>
    
        <!-- Actions Table -->
        <div>
            <table id="punishmentTable" class="table-auto w-full bg-[#ffffffe6] dark:bg-[#2c2c2ce6] text-[#333333] dark:text-[#e0e0e0] rounded-lg overflow-hidden shadow-custom">
                <thead>
                    <tr class="bg-[#ccc] dark:bg-[#444] text-left text-slate-800 dark:text-slate-300">
                        <th class="px-4 py-2">Type</th>
                        <th class="px-4 py-2">Player</th>
                        <th class="px-4 py-2">Executor</th>
                        <th class="px-4 py-2">Reason</th>
                        <th class="px-4 py-2">Execution Date</th>
                        <th class="px-4 py-2">Expiration Date</th>
                        <th class="px-4 py-2">Duration</th>
                        <th class="px-4 py-2">Status</th>
                    </tr>
                </thead>
                <tbody>
                    {{punishment_rows}}
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="flex justify-center mt-8 gap-4">
            <a href="#" id="prevPage" class="bg-[#c1c1c1] dark:bg-[#444] text-white py-2 px-4 rounded-md hover:bg-gray-600 disabled:bg-gray-500">
                <i class="fa-solid fa-angles-left"></i>
            </a>
            <input type="number" id="pageInput" min="1" max="{{total_pages}}" value="{{current_page}}" class="text-center w-16 bg-[#c1c1c1] dark:bg-[#444] text-black dark:text-white p-2 rounded-md">
            <a href="#" id="nextPage" class="bg-[#c1c1c1] dark:bg-[#444] text-white py-2 px-4 rounded-md hover:bg-gray-600 disabled:bg-gray-500">
                <i class="fa-solid fa-angles-right"></i>
            </a>
        </div>

        <!-- Modal -->
        <div id="filterModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-[#f4f4f4] dark:bg-[#2c2c2c] p-6 rounded-lg shadow-lg">
                <button class="close absolute top-4 right-4 text-white text-2xl">&times;</button>
                <h2 class="text-xl font-bold mb-4">Sort Punishments</h2>
                <div>
                    <label class="block mb-2">
                        <input type="radio" name="sortOption" value="name" class="mr-2"> Player Name (A-Z)
                    </label>
                    <label class="block mb-2">
                        <input type="radio" name="sortOption" value="date" class="mr-2"> Execution Date
                    </label>
                    <label class="block mb-2">
                        <input type="radio" name="sortOption" value="status" class="mr-2"> Status (Active/Expired/Removed)
                    </label>
                    <label class="block mb-2">
                        <input type="radio" name="sortOption" value="type" class="mr-2"> Type (Bans/Mutes/Warnings/Kicks)
                    </label>
                </div>
                <button id="applySort" class="bg-[#c1c1c1cc] dark:bg-[#3b3b3bcc] text-[#333333] dark:text-[#e0e0e0] p-4 mt-4 w-full rounded-lg">Apply Filter</button>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const darkModeToggle = document.getElementById('dark-mode-toggle');
            const darkModeIcon = document.getElementById('dark-mode-icon');

            const toggleDarkMode = () => {
                document.documentElement.classList.toggle('dark');

                darkModeIcon.classList.toggle('fa-moon');
                darkModeIcon.classList.toggle('fa-sun');

                if (document.documentElement.classList.contains('dark')) {
                    localStorage.setItem('darkMode', 'enabled');
                } else {
                    localStorage.setItem('darkMode', 'disabled');
                }
            };
        });

        $(document).ready(function () {
            const currentPage = parseInt("{{current_page}}");
            const totalPages = parseInt("{{total_pages}}");
            const player = "{{player_name}}";

            if (currentPage === 1) {
                $('#prevPage').addClass('disabled').attr('href', '#').removeAttr('href');
            } else {
                $('#prevPage').attr('href', `/player/${player}?page=${currentPage - 1}`);
            }

            if (currentPage === totalPages) {
                $('#nextPage').addClass('disabled').attr('href', '#').removeAttr('href');
            } else {
                $('#nextPage').attr('href', `/player/${player}?page=${currentPage + 1}`);
            }

            $('#pageInput').on('input', function () {
                const inputPage = parseInt($(this).val());
                if (inputPage >= 1 && inputPage <= totalPages) {
                    window.location.href = `/player/${player}?page=${inputPage}`;
                }
            });

            // Search Filtering
            $('#searchInput').on('input', function () {
                const input = $(this).val().toLowerCase().trim();
                $('#punishmentTable tbody tr').each(function () {
                    const rowText = $(this).text().toLowerCase();
                    $(this).toggle(rowText.includes(input));
                });
            });

            // Filter Modal
            const modal = $('#filterModal');
            const closeModal = $('.close');

            $('#filterButton').on('click', function () {
                modal.removeClass('hidden');
            });

            closeModal.on('click', function () {
                modal.addClass('hidden');
            });

            $(window).on('click', function (event) {
                if ($(event.target).is(modal)) {
                    modal.addClass('hidden');
                }
            });

            // Apply Filter Sort
            $('#applySort').on('click', function () {
                const selectedOption = $('input[name="sortOption"]:checked').val();
                if (selectedOption) {
                    sortTable(selectedOption);
                    modal.addClass('hidden');
                }
            });

            // Sort Table Logic
            function sortTable(sortBy) {
                const rows = $('#punishmentTable tbody tr').get();
                
                const typeOrder = ["IP-Ban", "Ban", "IP-Mute", "Mute", "Warning", "Kick"];

                rows.sort(function (a, b) {
                    let keyA, keyB;

                    if (sortBy === 'name') {
                        keyA = $(a).children('td').eq(1).text().toLowerCase();
                        keyB = $(b).children('td').eq(1).text().toLowerCase();
                    } else if (sortBy === 'date') {
                        keyA = new Date($(a).children('td').eq(4).text());
                        keyB = new Date($(b).children('td').eq(4).text());
                    } else if (sortBy === 'status') {
                        keyA = $(a).children('td').eq(7).text().toLowerCase();
                        keyB = $(b).children('td').eq(7).text().toLowerCase();
                    } else if (sortBy === 'type') {
                        keyA = $(a).children('td').eq(0).text();
                        keyB = $(b).children('td').eq(0).text();
                        
                        keyA = typeOrder.indexOf(keyA);
                        keyB = typeOrder.indexOf(keyB);
                    }

                    return keyA < keyB ? -1 : keyA > keyB ? 1 : 0;
                });

                $.each(rows, function (index, row) {
                    $('#punishmentTable').children('tbody').append(row);
                });
            }
        });
    </script>

</body>

</html>
