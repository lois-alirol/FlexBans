#
# The port that will host the web pages.
# If you are using a hosting solution like Pterodactyl, 
# make sure to allocate a new port in the "Network" tab of your panel.
license-key: "X"

# 'locale' will set the language to the same as the system language
language: "en_US"

webserver:
  enabled: true
  port: 8080
  url: "localhost"
  https: true
  pages:
    punishments:
      punishment-execution-button: true
      bans:
        enabled: true
        max-per-page: 20
      mutes:
        enabled: true
        max-per-page: 20
      warnings:
        enabled: true
        max-per-page: 20
      kicks:
        enabled: true
        max-per-page: 20
    details:
      moderator:
        enabled: true
        max-per-page: 20
      player:
        enabled: true
        max-per-page: 20
      punishment:
        enabled: true
        revoke-button: true

database:
  #H2, SQLITE or MYSQL are supported. You will most likely need MySQL if you run a multi-proxy instance.
  type: "H2"
  hostname: "example.com"
  port: 3306
  database: "flexbans"
  username: "root"
  password: "mypassword"


punishments-system:
  # set "built-in.enabled" to false if you want to use another punishment plugin
  # there will be issues if you enabled both "built-in" and a plugin under the "hooks" section.
  built-in:
    enabled: true
    bans:
      enabled: true
    mutes:
      enabled: true
    warnings:
      enabled: true
    kicks:
      enabled: true

  hooks:
    litebans: false


# Settings for how the server will appear on the web page.
server-display:
  # The name of the server that will be displayed.
  name: "Example"
  # URL to the server's icon image.
  logo: "https://i.imgur.com/iweixVA.png"
  # URL to the server's favicon.
  favicon: "https://i.imgur.com/iweixVA.png"
  # Primary branding color for the server (in hexadecimal format).
  color: "#4097e7"
  # A darker shade of the primary branding color for accents.
  darker-color: "#285577"
  # A short description of the server.
  description: "This is an example server"

# Configuration for Discord OAuth2 login.
discord-oauth:
  # Set to true to enable Discord OAuth2 login.
  enabled: false
  # Client ID from your Discord application.
  client-id: "your-discord-client-id"
  # Client Secret from your Discord application.
  client-secret: "your-discord-client-secret"
  # URL to which Discord will redirect after successful login.
  redirect-uri: "http://localhost:8080/callback"
  # OAuth2 scope specifying the data to request (e.g., "identify" for basic user info).
  scope: "identify"
  # List of Discord user IDs allowed to access the application.
  allowed-users:
    - "user_id_1"
    - "user_id_2"

password-auth:
  enabled: true
  allowed-players: [ ]


# DO NOT TOUCH
config_version: "1.0"