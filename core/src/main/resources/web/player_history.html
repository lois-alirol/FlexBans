<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{player_name}} Punishments</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="/css/player_history.styles.css">
    <script src="https://cdn.tailwindcss.com/"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <meta property="og:title" content="{{player_name}} Punishments">
    <meta property="og:description" content="{{player_description}}">
    <meta property="og:image" content="{{player_icon}}">
    <meta name="theme-color" content="{{server_color}}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{favicon}}">
    <script src="/js/dark-mode-init.js"></script>
</head>

<body class="bg-white text-[#333333] dark:text-[#e0e0e0] dark:bg-[#1c1c1c]">

<div class="max-w-7xl mx-auto p-5">

    {{back_to_index_button}}

    <h1 class="text-center text-black dark:text-white text-3xl font-bold">{{player_name}} Recent Punishments</h1>

    {{search_moderator_section}}

    {{table_content}}

    {{empty_state_content}}

    {{pagination_content}}

</div>

<script src="/js/dark-mode-toggle.js"></script>
<script src="/js/mod-search-clear.js"></script>
<script src="/js/search-filters.js"></script>
<script>
    $(document).ready(function () {
        const currentPage = parseInt("{{current_page}}");
        const totalPages = parseInt("{{total_pages}}");
        const player = "{{player_name}}";

        if ($('#prevPage').length > 0) {
            if (currentPage === 1) {
                $('#prevPage').addClass('disabled').attr('href', '#').removeAttr('href');
            } else {
                $('#prevPage').attr('href', `/player/${player}?page=${currentPage - 1}`);
            }

            if (currentPage === totalPages) {
                $('#nextPage').addClass('disabled').attr('href', '#').removeAttr('href');
            } else {
                $('#nextPage').attr('href', `/player/${player}?page=${currentPage + 1}`);
            }

            $('#pageInput').on('input', function () {
                const inputPage = parseInt($(this).val());
                if (inputPage >= 1 && inputPage <= totalPages) {
                    window.location.href = `/player/${player}?page=${inputPage}`;
                }
            });

            $('#pageInput').on('blur', function () {
                const inputPage = parseInt($(this).val());
                if (isNaN(inputPage) || inputPage < 1 || inputPage > totalPages) {
                    $(this).val(currentPage);
                }
            });
        }
    });
</script>

</body>

</html>
