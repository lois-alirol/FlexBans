<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="{{server_name}} Register">
    <meta property="og:description" content="Register to access the {{server_name}} dashboard.">
    <meta property="og:image" content="{{server_icon}}">
    <meta name="theme-color" content="{{server_color}}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" sizes="48x48" href="{{server_favicon}}">
    <title>{{server_name}} Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-[#2e2e2e] text-[#e4e4e7] flex items-center justify-center min-h-screen">
    <div class="bg-[#1f1f1f] p-8 rounded-lg shadow-lg w-full max-w-md">
        <img src="{{server_logo}}" alt="Server Logo" class="w-24 mx-auto mb-6">
        <h1 class="text-3xl font-bold text-center mb-4">Register for {{server_name}}</h1>
        <form action="/register" method="POST" class="space-y-4">
            <div>
                <div id="status-message" class="hidden mb-2 text-sm font-medium px-4 py-2 rounded-lg"></div>

                <label for="username" class="block text-sm font-medium mb-1">Username</label>
                <input type="text" id="username" name="username" required
                    class="w-full bg-[#2e2e2e] text-[#e4e4e7] border border-[#4b5563] rounded-lg py-2 px-4 focus:outline-none focus:ring-2 focus:ring-[{{server_color}}]">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required
                        class="w-full bg-[#2e2e2e] text-[#e4e4e7] border border-[#4b5563] rounded-lg py-2 px-4 pr-12 focus:outline-none focus:ring-2 focus:ring-[{{server_color}}]">
                    <button type="button" id="show-password-btn" 
                        class="absolute inset-y-0 right-0 flex items-center justify-center w-10 text-[#a1a1aa] hover:text-[#e4e4e7] focus:outline-none">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <p id="password-feedback" class="text-sm text-red-500 mt-1"></p>
            </div>
            <div>
                <label for="confirm-password" class="block text-sm font-medium mb-1">Confirm Password</label>
                <div class="relative">
                    <input type="password" id="confirm-password" name="confirm-password" required
                        class="w-full bg-[#2e2e2e] text-[#e4e4e7] border border-[#4b5563] rounded-lg py-2 px-4 pr-12 focus:outline-none focus:ring-2 focus:ring-[{{server_color}}]">
                    <button type="button" id="show-confirm-password-btn"
                        class="absolute inset-y-0 right-0 flex items-center justify-center w-10 text-[#a1a1aa] hover:text-[#e4e4e7] focus:outline-none">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <p id="confirm-feedback" class="text-sm text-red-500 mt-1"></p>
            </div>
            <button type="submit"
                class="w-full bg-[{{server_color}}] hover:bg-[{{server_color_hover}}] text-white font-bold py-2 rounded-lg transition duration-300">
                Register
            </button>
        </form>
        <p class="mt-4 text-center text-sm text-[#a1a1aa]">Already have an account? <a href="/login"
                class="text-[{{server_color}}] hover:underline">Log in here</a>.</p>
    </div>

    <script>
        function togglePasswordVisibility(buttonId, inputId) {
            const button = document.getElementById(buttonId);
            const input = document.getElementById(inputId);

            button.addEventListener('mousedown', () => {
                input.type = 'text';
            });

            button.addEventListener('mouseup', () => {
                input.type = 'password';
            });

            button.addEventListener('mouseleave', () => {
                input.type = 'password';
            });
        }

        togglePasswordVisibility('show-password-btn', 'password');
        togglePasswordVisibility('show-confirm-password-btn', 'confirm-password');

        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const passwordFeedback = document.getElementById('password-feedback');
        const confirmFeedback = document.getElementById('confirm-feedback');

        const form = document.querySelector('form');
        const submitButton = form.querySelector('button[type="submit"]');

        function validatePasswords() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (confirmPassword.trim() !== '') {
                confirmFeedback.innerText = password === confirmPassword ? '' : 'Passwords do not match.';
            } else {
                confirmFeedback.innerText = '';
            }

            const isValid = password === confirmPassword &&
                password.length >= 8 &&
                /[A-Z]/.test(password) &&
                /[a-z]/.test(password) &&
                /[!@#$%^&*(),.?":{}|<>]/.test(password);

            submitButton.disabled = !isValid;
        }

        passwordInput.addEventListener('input', validatePasswords);
        confirmPasswordInput.addEventListener('input', validatePasswords);

        passwordInput.addEventListener('input', function () {
            const password = this.value;
            const criteria = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                special: /[!@#$%^&*(),.?":{}|<>]/.test(password),
            };

            let feedback = '';
            if (!criteria.length) feedback += 'Password must be at least 8 characters long.\n';
            if (!criteria.uppercase) feedback += 'Password must contain at least one uppercase letter.\n';
            if (!criteria.lowercase) feedback += 'Password must contain at least one lowercase letter.\n';
            if (!criteria.special) feedback += 'Password must contain at least one special character.\n';

            passwordFeedback.innerText = feedback;
        });

        passwordInput.addEventListener('input', validatePasswords);
        confirmPasswordInput.addEventListener('input', validatePasswords);

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            const data = {
                username,
                password,
                confirmPassword,
            };

            $.ajax({
                url: '/register/submit',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function (response) {
                    const statusMsg = document.getElementById('status-message');
                    statusMsg.classList.remove('bg-red-600');
                    statusMsg.classList.add('bg-green-600', 'text-white');
                    statusMsg.textContent = 'Login successful! Redirecting...';
                    statusMsg.classList.remove('hidden');

                    setTimeout(() => {
                        location.href = '/index'; // more reliable
                    }, 1000);
                },

                error: function (xhr) {
                    let errorText = xhr.responseText;
                    try {
                        const json = JSON.parse(errorText);
                        if (json.error) errorText = json.error;
                    } catch (e) {
                    }

                    const statusMsg = document.getElementById('status-message');
                    statusMsg.classList.remove('bg-green-600');
                    statusMsg.classList.add('bg-red-600', 'text-white');
                    statusMsg.textContent = errorText || 'Unknown error';
                    statusMsg.classList.remove('hidden');
                }
            });
        });
    </script>

</body>

</html>
