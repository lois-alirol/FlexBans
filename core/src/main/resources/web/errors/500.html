<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="500 - {{server_name}}">
    <meta property="og:description" content="Internal server error on {{server_name}}">
    <meta property="og:image" content="{{server_icon}}">
    <meta name="theme-color" content="{{server_color}}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/errors/500.styles.css">
    <link rel="icon" type="image/x-icon" sizes="48x48" href="{{server_favicon}}">
    <title>500 - {{server_name}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#2e2e2e] text-[#e4e4e7] flex items-center justify-center min-h-screen">
    <div class="bg-[#1f1f1f] p-8 rounded-lg shadow-lg w-full max-w-lg text-center">
        <img src="{{server_logo}}" alt="Server Logo" class="w-32 mx-auto mb-6">
        <h1 class="text-5xl mb-4 font-bold">500 Internal Error</h1>
        <p class="mb-4 text-lg">Something went wrong on our end. Please try again later.</p>
        <div class="bg-[#1a1a1a] text-left p-4 rounded-md overflow-auto max-h-60 text-s">
            <pre class="text-[#d1d5db]"><code>{{stack_trace}}</code></pre>
        </div>      
        <a href="/" class="mt-6 bg-[{{server_color}}] hover:bg-[{{server_color_hover}}] text-white font-bold py-3 px-6 rounded-lg inline-block transition duration-300">
            <i class="fa-solid fa-home mr-2"></i>Return to Homepage
        </a>
    </div>
</body>

</html>
