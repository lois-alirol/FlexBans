player-added-to-whitelist:
  enabled: true
  url: "https://discord.com/api/webhooks/your-webhook-url"
  content: "**%player%** has been added to the whitelist!"
  
  embed:
    enabled: true
    color: "#ffcc00"
    author:
      name: "Whitelist Manager"
      url: "https://example.com"
      image-url: "https://example.com/icon.png"
    thumbnail-url: "https://minotar.net/avatar/%player%"
    title:
      text: "New Whitelist Entry"
      url: "https://example.com/player/%player%"
    description: "Player **%player%** has been successfully added to the whitelist."
    image-url: "https://example.com/whitelist-banner.png"
    footer:
      text: "Whitelist System"
      icon-url: "https://example.com/footer-icon.png"
    timestamp: true
    fields:
      - name: "Player"
        value: "%player%"
        inline: true
      - name: "Whitelisted By"
        value: "%whitelisted_by%"
        inline: true
      - name: "Reason"
        value: "Manually approved"
        inline: false

player-removed-from-whitelist:
  enabled: true
  url: ''
  content:
    author: 'LiteBansWeb'
    author-icon: 'https://mc-heads.net/avatar/Neocle'
    title: 'Player Unwhitelisted from LiteBansWeb'
    description: '```[-] Player %player% has removed from the whitelist, and now cannot access the LiteBansWeb dashboard.```'
    color: '#96ff44'
    thumbnail: 'https://mc-heads.net/avatar/%player%'
    footer: 'LiteBansWeb'
    footer-icon: 'https://mc-heads.net/avatar/Neocle'
    timestamp: true

