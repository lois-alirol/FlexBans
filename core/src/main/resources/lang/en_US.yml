commands:
  unknown: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Unknown command, use /flexbans help for a list of commands."
  players-only: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Only players can use this command."
  no-permission: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>You do not have permission to use this command."
  verify:
    usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Usage: /flexbans verify <code>"
    success: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Verification successful! Your account has been verified, you can now access the punishments dashboard."
    unknown-code: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>The verification code %code% does not exist or has already been used."
    fail: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>An error occurred while verifying your account. Please try again later."
    error: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>An unexpected error occurred. Please contact an administrator."
  reload:
    usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Usage: /flexbans reload"
    success: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>FlexBans configuration reloaded successfully."
    fail: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Failed to reload configuration."
    error: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>An unexpected error occurred. Please contact an administrator."
  players-whitelist:
    usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Usage: /flexbans players <add / remove> <player>"
    add-player:
      usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Usage: /flexbans players add <player>"
      success: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Player added successfully."
      already-added: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Player is already whitelisted."
      not-added: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Player could not be added."
    remove-player:
      usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Usage: /flexbans players remove <player>"
      success: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Player removed successfully."
  discord-whitelist:
    usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Usage: /flexbans discord <add / remove> <user-id>"
    add-user:
      usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Usage: /flexbans discord add <user-id>"
      success: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Discord user added successfully."
      already-added: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Discord user is already whitelisted."
      not-added: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Discord user could not be added."
    remove-user:
      usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Usage: /flexbans discord remove <user-id>"
      success: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Discord user removed successfully."
  logging:
    verify:
      sql-exception: "SQL Error while verifying user: %error%"
      exception: "Unexpected error: %error%"
    reload:
      fail: "Failed to reload configuration."
      success: "FlexBans configuration reloaded successfully."
  help:
    message: |
      <gradient:#ffa600:#ffd04e>---==========≡≡≡≡<dark_gray>[ <bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold> ]</dark_gray>≡≡≡≡==========---
      <#ffa600>> /fb help</#ffa600> <gray>- shows this menu</gray>
      <#ffa600>> /fb reload <gray>- reloads configuration
      <#ffa600>> /fb verify <code> <gray>- verify your access to the dashboard (if https enabled)
      <#ffa600>> /fb players <add/remove> <player> <gray>- add a player to the dashboard whitelist
      <#ffa600>> /fb discord <add/remove> <user-id> <gray>- add a discord user to the dashboard whitelist
      <gradient:#ffa600:#ffd04e>---============≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡≡============---


punishments:
  default-reason: "No reason provided"
  infinite-duration: "Infinite ∞"
  silent-prefix: "<#919191>[Silent] "
  ban:
    disconnect-message: |
      <bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold>
      <#ff4747>ʏᴏᴜ ᴀʀᴇ ʙᴀɴɴᴇᴅ ꜰʀᴏᴍ ᴛʜɪꜱ ꜱᴇʀᴠᴇʀ!

      <gray>• Reason: <white>%reason%
      <gray>• Banned by: <white>%moderator%
      <gray>• Date: <white>%date%
      <gray>• Duration: <white>%duration%

      <gray>You can appeal at:
      <u><white>https://discord.gg/zN5kfrW2UQ

    broadcast-message: |
      <#ff4747>%target% was banned from the network!

      <gray>• Reason: <white>%reason%
      <gray>• Banned by: <white>%moderator%
      <gray>• Duration: <white>%duration%

    silent-broadcast-message: |
      <i><gray>[SILENT]
      <i><#ff4747>%target% was banned from the network!

      <i><gray>• Reason: <white>%reason%
      <i><gray>• Banned by: <white>%moderator%
      <i><gray>• Duration: <white>%duration%

  kick:
    disconnect-message: |
      <bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold>
      <#ff4747>ʏᴏᴜ ᴡᴇʀᴇ ᴋɪᴄᴋᴇᴅ ꜰʀᴏᴍ ᴛʜɪꜱ ꜱᴇʀᴠᴇʀ!

      <gray>• Reason: <white>%reason%
      <gray>• Kicked by: <white>%moderator%

      <gray>You can contact us at:
      <u><white>https://discord.gg/zN5kfrW2UQ

    broadcast-message: |
      <#ff4747>%target% was kicked from the network!

      <gray>• Reason: <white>%reason%
      <gray>• Kicked by: <white>%moderator%

    silent-broadcast-message: |
      <i><gray>[SILENT]
      <i><#ff4747>%target% was kicked from the network!

      <i><gray>• Reason: <white>%reason%
      <i><gray>• Kicked by: <white>%moderator%

  mute:
    alert-message: |
      <#ff4747>ʏᴏᴜ ʜᴀᴠᴇ ʙᴇᴇɴ ᴍᴜᴛᴇᴅ ᴏɴ ᴛʜɪꜱ ꜱᴇʀᴠᴇʀ!
      <gray>| Reason: <white>%reason%
      <gray>| Muted by: <white>%moderator%
    chat-message: |
      <#ff4747>ʏᴏᴜ ᴀʀᴇ ᴍᴜᴛᴇᴅ ᴏɴ ᴛʜɪꜱ ꜱᴇʀᴠᴇʀ!
      <gray>| Reason: <white>%reason%
      <gray>| Muted by: <white>%moderator%
    command-message: |
      <#ff4747>ʏᴏᴜ ᴀʀᴇ ᴍᴜᴛᴇᴅ ᴀɴᴅ ᴄᴀɴ'ᴛ ᴜꜱᴇ ᴛʜɪꜱ ᴄᴏᴍᴍᴀɴᴅ!
      <gray>| Reason: <white>%reason%
      <gray>| Muted by: <white>%moderator%

    broadcast-message: |
      <#ff4747>%target% was muted from the network!

      <gray>• Reason: <white>%reason%
      <gray>• Muted by: <white>%moderator%
