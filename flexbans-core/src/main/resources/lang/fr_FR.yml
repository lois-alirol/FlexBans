commands:
  unknown: "<bold><>FlexBans</gradient></bold><gray> » <white>Commande inconnue, utilisez /flexbans help pour obtenir la liste des commandes."
  players-only: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Seuls les joueurs peuvent utiliser cette commande."
