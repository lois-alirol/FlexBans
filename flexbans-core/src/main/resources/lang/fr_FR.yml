  verify:
    usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Utilisation : /flexbans verify <code>"
    success: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Vérification réussie ! Votre compte a été vérifié, vous pouvez désormais accéder au tableau de bord des sanctions."
