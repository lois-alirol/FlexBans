      not-added: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Le joueur n'a pas pu être ajouté."
    remove-player:
      usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Utilisation : /flexbans players remove <player>"
