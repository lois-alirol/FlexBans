    error: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Une erreur inattendue s'est produite. Veuillez contacter un administrateur."
  reload:
    usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Utilisation : /flexbans reload"
    success: "<bold><gradient:#ffa600:#fgradient:#ffa600:#ffd04efd04e>FlexBans</gradient></bold><gray> » <white>Configuration de FlexBans rechargée avec succès."
    fail: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Échec du rechargement de la configuration."
    error: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Une erreur inattendue s'est produite. Veuillez contacter un administrateur."
  players-whitelist:
    usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Utilisation : /flexbans players <add / remove> <player>"
    add-player:
      usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Utilisation : /flexbans players add <player>"
      success: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Joueur ajouté avec succès."
      already-added: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Le joueur est déjà dans la whitelist."
      not-added: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Le joueur n'a pas pu être ajouté."
    remove-player:
      usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Utilisation : /flexbans players remove <player>"
      success: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Joueur retiré avec succès."
  discord-whitelist:
    usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Utilisation : /flexbans discord <add / remove> <user-id>"
    add-user:
      usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Utilisation : /flexbans discord add <user-id>"
      success: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Utilisateur Discord ajouté avec succès."
      already-added: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>L'utilisateur Discord est déjà dans la whitelist."
      not-added: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>L'utilisateur Discord n'a pas pu être ajouté."
    remove-user:
      usage: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Utilisation : /flexbans discord remove <user-id>"
      success: "<bold><gradient:#ffa600:#ffd04e>FlexBans</gradient></bold><gray> » <white>Utilisateur Discord retiré avec succès."
  logging:
    verify:
      sql-exception: "Erreur SQL lors de la vérification de l'utilisateur : %error%"
      exception: "Erreur inattendue : %error%"
    reload:
      fail: "Échec du rechargement de la configuration."
