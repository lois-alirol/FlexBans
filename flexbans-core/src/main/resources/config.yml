#
# The port that will host the web pages.
# If you are using a hosting solution like Pterodactyl, 
# make sure to allocate a new port in the "Network" tab of your panel.
license-key: "X"
debug-mode: false

# 'locale' will set the language to the same as the system language
language: "en_US"

webserver:
  enabled: true
  port: 8080
  url: "localhost"
  https: true
  pages:
    punishments:
      punishment-execution-button: true
      bans:
        enabled: true
        max-per-page: 20
      mutes:
        enabled: true
        max-per-page: 20
      warnings:
        enabled: true
        max-per-page: 20
      kicks:
        enabled: true
        max-per-page: 20
    details:
      moderator:
        enabled: true
        max-per-page: 20
      player:
        enabled: true
        max-per-page: 20
      punishment:
        enabled: true
        revoke-button: true

database:
  #SQLITE or MYSQL are supported. You will most likely need MySQL if you run a multi-proxy instance.
  type: "H2"
  hostname: "example.com"
  port: 3306
  database: "flexbans"
  username: "root"
  password: "mypassword"


punishments-system:
  built-in:
    enabled: true
    notify-moderators: true
    log-to-console: true

    bans:
      enabled: true
      broadcast: true
      ip-ban: true
      allow-temp-bans: true
      notify-on-join: true
      exempt-permission: "flexbans.bypass.ban"

    mutes:
      enabled: true
      block-all-commands: true
      blocked-commands:
        - "/msg"
        - "/whisper"
      notify-on-chat: true
      exempt-permission: "flexbans.bypass.mute"

    warnings:
      enabled: true
      actions:
        enabled: true
        action-thresholds:
          3:
            type: "MUTE"
            duration: 1h
            broadcast: true
          5:
            type: "BAN"
            duration: 15d
            broadcast: true
          10:
            type: "BAN"
            duration: PERMANENT
            broadcast: true
      expires-after-days: 30
      notify-player: true

    kicks:
      enabled: true
      broadcast: false
      notify-player: true
      exempt-permission: "flexbans.bypass.kick"

    reason-presets:
      enabled: true
      list:
        - "Inappropriate language"
        - "Cheating or unfair advantage"
        - "Harassment or bullying"
        - "Advertising other servers"
        - "Griefing or trolling"
        - "Spamming or flooding chat"

    audit-logging:
      enabled: true
      log-file: "logs/punishments.log"
      include-reason: true
      include-moderator: true


# Settings for how the server will appear on the web page.
server-display:
  # The name of the server that will be displayed.
  name: "Example"
  # URL to the server's icon image.
  logo: "https://i.imgur.com/iweixVA.png"
  # URL to the server's favicon.
  favicon: "https://i.imgur.com/iweixVA.png"
  # Primary branding color for the server (in hexadecimal format).
  color: "#4097e7"
  # A darker shade of the primary branding color for accents.
  darker-color: "#285577"
  # A short description of the server.
  description: "This is an example server"

# Configuration for Discord OAuth2 login.
discord-oauth:
  # Set to true to enable Discord OAuth2 login.
  enabled: false
  # Client ID from your Discord application.
  client-id: "your-discord-client-id"
  # Client Secret from your Discord application.
  client-secret: "your-discord-client-secret"
  # URL to which Discord will redirect after successful login.
  redirect-uri: "http://localhost:8080/callback"
  # OAuth2 scope specifying the data to request (e.g., "identify" for basic user info).
  scope: "identify"
  # List of Discord user IDs allowed to access the application.
  allowed-users:
    - "user_id_1"
    - "user_id_2"

password-auth:
  enabled: true
  allowed-players: [ ]


# DO NOT TOUCH
config_version: "1.0"